name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: New-Item -ItemType Directory -Force build
      - run: python -m pytest -q --basetemp=build/pytest-temp
      - run: python main.py --smoke-test build/smoke
