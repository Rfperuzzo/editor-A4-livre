name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: New-Item -ItemType Directory -Force build
      - run: python -m pytest -q --basetemp=build/pytest-temp
      - run: python main.py --smoke-test build/smoke
      - name: Build and test Windows executable
        run: .\build_windows.ps1 -Python (Get-Command python).Source -Output build/package -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: EditorA4Livre-Windows-x64
          path: build/package/EditorA4Livre
